# Model-tier configuration for the AI gateway (LLM_BASE_URL / Orbio).
#
# Switch tiers without touching code: set MODEL_TIER in .env to one of the
# keys below (default: draft). Model ids use the gateway's OpenRouter-style
# "provider/model" naming - all three are verified working against
# https://api.orbio.so/api/v1 as of 2026-09-09.
default_tier: draft

tiers:
  draft:
    model: anthropic/claude-haiku-4.5
    description: >
      Cheap/fast model for iterating on prompts and logic. Use this while
      building - it's the default so nobody burns production-tier spend by
      accident during development.

  production:
    model: anthropic/claude-sonnet-5
    description: >
      The model used for the actual analysis output shown to users. Switch
      to this once prompts/logic are stable.

  premium:
    model: anthropic/claude-opus-5
    description: >
      Reserved for the final demo/polish pass only - highest quality,
      highest cost. Don't leave this on as the default.
